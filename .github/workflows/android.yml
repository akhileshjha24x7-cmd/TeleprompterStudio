name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android

      - name: Use stable Android NDK version
        shell: bash
        run: |
          set -e
          # Use NDK 27 instead of 28.2, whose archive failed to unpack on the runner.
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Accept Android SDK licenses separately; ignore the harmless yes/Broken-pipe status.
          yes | "$SDKMANAGER" --licenses || true
          rm -rf "$ANDROID_HOME/ndk/27.0.12077973" "$ANDROID_HOME/.temp/"*
          "$SDKMANAGER" --install "ndk;27.0.12077973"

      - name: Get packages
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teleprompterstudio-split-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
