name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android

      - name: Repair and install Android NDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          # Remove any incomplete/corrupt download left by an earlier SDK setup.
          rm -rf "$NDK_DIR" "$ANDROID_HOME/.temp/"*
          for attempt in 1 2 3; do
            echo "Installing NDK 28.2.13676358 (attempt $attempt/3)"
            if yes | "$SDKMANAGER" --install "ndk;28.2.13676358"; then
              break
            fi
            rm -rf "$NDK_DIR" "$ANDROID_HOME/.temp/"*
            if [ "$attempt" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done

      - name: Get packages
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teleprompterstudio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
